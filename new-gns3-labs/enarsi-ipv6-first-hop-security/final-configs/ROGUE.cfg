hostname ROGUE
no ip domain-lookup
ipv6 unicast-routing
!
interface Ethernet0/0
 no ip address
 ipv6 address FE80::66 link-local
 ipv6 address 2001:DB8:10::66/64
 ipv6 nd ra suppress all
 no shutdown
!
interface Loopback99
 ipv6 address 2001:DB8:99::66/128
!
ipv6 route ::/0 2001:DB8:10::1
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
