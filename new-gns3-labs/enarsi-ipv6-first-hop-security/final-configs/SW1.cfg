hostname SW1
no ip domain-lookup
!
vlan 10
 name USERS
!
ipv6 snooping policy LEARN
 security-level glean
 protocol ndp
 protocol dhcp
!
ipv6 prefix-list LAN-RA seq 5 permit 2001:DB8:10::/64
ipv6 access-list RA-R1
 permit ipv6 host FE80::1 any
!
ipv6 nd raguard policy RA-HOST
 device-role host
!
ipv6 nd raguard policy RA-ROUTER
 device-role router
 match ipv6 access-list RA-R1
 match ra prefix-list LAN-RA
!
ipv6 access-list DHCP-R1
 permit ipv6 host FE80::1 any
!
ipv6 dhcp guard policy DHCP-CLIENT
 device-role client
!
ipv6 dhcp guard policy DHCP-SERVER
 device-role server
 match server access-list DHCP-R1
!
ipv6 source-guard policy SG-HOST
 validate address
!
interface Ethernet0/0
 description TO-R1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 ipv6 nd raguard attach-policy RA-ROUTER
 ipv6 dhcp guard attach-policy DHCP-SERVER
 no shutdown
!
interface Ethernet0/1
 description TO-H1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 ipv6 nd raguard attach-policy RA-HOST
 ipv6 dhcp guard attach-policy DHCP-CLIENT
 ipv6 source-guard attach-policy SG-HOST
 no shutdown
!
interface Ethernet0/2
 description TO-ROGUE
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 ipv6 nd raguard attach-policy RA-HOST
 ipv6 dhcp guard attach-policy DHCP-CLIENT
 ipv6 source-guard attach-policy SG-HOST
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
