hostname R1
no ip domain-lookup
ipv6 unicast-routing
!
ipv6 dhcp pool USERS
 address prefix 2001:DB8:10::/64
 dns-server 2001:DB8:20::2
 domain-name legitimate.example
!
interface Ethernet0/0
 no ip address
 ipv6 address FE80::1 link-local
 ipv6 address 2001:DB8:10::1/64
 ipv6 nd managed-config-flag
 ipv6 dhcp server USERS
 no shutdown
!
interface Ethernet0/1
 no ip address
 ipv6 address FE80::1 link-local
 ipv6 address 2001:DB8:20::1/64
 ipv6 nd ra suppress all
 no shutdown
!
ipv6 route 2001:DB8:99::/64 2001:DB8:10::66
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
