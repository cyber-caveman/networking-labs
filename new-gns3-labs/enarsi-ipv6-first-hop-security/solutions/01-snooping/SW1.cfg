hostname SW1
no ip domain-lookup
!
vlan 10
 name USERS
!
ipv6 snooping policy LEARN
 security-level glean
 protocol ndp
 protocol dhcp
!
interface Ethernet0/0
 description TO-R1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 no shutdown
!
interface Ethernet0/1
 description TO-H1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 no shutdown
!
interface Ethernet0/2
 description TO-ROGUE
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 ipv6 snooping attach-policy LEARN
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
