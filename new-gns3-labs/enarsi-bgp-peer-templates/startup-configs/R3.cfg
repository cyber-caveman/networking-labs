! ENARSI BGP peer templates - isolated training lab
hostname R3
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface Loopback10
 ip address 10.3.0.1 255.255.255.0
!
interface Loopback100
 ip address 203.0.113.1 255.255.255.0
!
interface Loopback199
 ip address 198.18.3.1 255.255.255.0
!
interface Ethernet0/0
 description TO-R1
 ip address 172.16.13.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
