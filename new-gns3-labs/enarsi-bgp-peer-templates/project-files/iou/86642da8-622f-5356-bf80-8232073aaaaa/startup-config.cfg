! ENARSI BGP peer templates - isolated training lab
hostname R1
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Loopback10
 ip address 10.1.0.1 255.255.255.0
!
interface Ethernet0/0
 description TO-R2-Ethernet0/0
 ip address 172.16.12.1 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TO-R3-Ethernet0/0
 ip address 172.16.13.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description TO-R4-Ethernet0/0
 ip address 172.16.14.1 255.255.255.252
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
