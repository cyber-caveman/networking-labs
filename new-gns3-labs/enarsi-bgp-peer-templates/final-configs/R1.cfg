! ENARSI BGP peer templates - isolated training lab
hostname R1
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Loopback10
 ip address 10.1.0.1 255.255.255.0
!
interface Ethernet0/0
 description TO-R2-Ethernet0/0
 ip address 172.16.12.1 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TO-R3-Ethernet0/0
 ip address 172.16.13.1 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description TO-R4-Ethernet0/0
 ip address 172.16.14.1 255.255.255.252
 no shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
ip prefix-list EDGE-IN seq 10 permit 10.2.0.0/24
ip prefix-list EDGE-IN seq 20 permit 10.3.0.0/24
ip prefix-list EDGE-IN seq 30 permit 10.4.0.0/24
ip prefix-list EDGE-IN seq 40 permit 203.0.113.0/24
ip prefix-list HUB-ONLY seq 10 permit 10.1.0.0/24
!
route-map LP-200 permit 10
 set local-preference 200
!
route-map LP-150 permit 10
 set local-preference 150
!
route-map LP-100 permit 10
 set local-preference 100
!
router bgp 65000
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 template peer-session SESSION-BASE
  timers 10 30
  password EnarsiBGP
 exit-peer-session
 template peer-session EDGE-SESSION
  inherit peer-session SESSION-BASE
 exit-peer-session
 template peer-policy EDGE-BASE
  prefix-list EDGE-IN in
  prefix-list HUB-ONLY out
  maximum-prefix 10
 exit-peer-policy
 template peer-policy PREF-200
  route-map LP-200 in
 exit-peer-policy
 template peer-policy PREF-150
  route-map LP-150 in
 exit-peer-policy
 template peer-policy PREF-100
  route-map LP-100 in
 exit-peer-policy
 template peer-policy PREFERRED
  inherit peer-policy EDGE-BASE 10
  inherit peer-policy PREF-200 20
 exit-peer-policy
 template peer-policy BACKUP
  inherit peer-policy EDGE-BASE 10
  inherit peer-policy PREF-150 20
 exit-peer-policy
 template peer-policy LAST
  inherit peer-policy EDGE-BASE 10
  inherit peer-policy PREF-100 20
 exit-peer-policy
 neighbor 172.16.12.2 remote-as 65102
 neighbor 172.16.12.2 inherit peer-session EDGE-SESSION
 neighbor 172.16.13.2 remote-as 65103
 neighbor 172.16.13.2 inherit peer-session EDGE-SESSION
 neighbor 172.16.14.2 remote-as 65104
 neighbor 172.16.14.2 inherit peer-session EDGE-SESSION
 !
 address-family ipv4 unicast
  network 10.1.0.0 mask 255.255.255.0
  neighbor 172.16.12.2 activate
  neighbor 172.16.12.2 inherit peer-policy PREFERRED
  neighbor 172.16.13.2 activate
  neighbor 172.16.13.2 inherit peer-policy BACKUP
  neighbor 172.16.14.2 activate
  neighbor 172.16.14.2 inherit peer-policy LAST
 exit-address-family
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
