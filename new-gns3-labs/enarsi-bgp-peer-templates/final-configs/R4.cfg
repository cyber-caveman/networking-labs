! ENARSI BGP peer templates - isolated training lab
hostname R4
no ip domain-lookup
ip cef
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
!
interface Loopback10
 ip address 10.4.0.1 255.255.255.0
!
interface Loopback100
 ip address 203.0.113.1 255.255.255.0
!
interface Loopback199
 ip address 198.18.4.1 255.255.255.0
!
interface Ethernet0/0
 description TO-R1
 ip address 172.16.14.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
!
interface Ethernet0/3
 no ip address
 shutdown
!
ip prefix-list HUB-ONLY seq 10 permit 10.1.0.0/24
!
router bgp 65104
 bgp router-id 4.4.4.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 template peer-session SESSION-BASE
  timers 10 30
  password EnarsiBGP
 exit-peer-session
 template peer-session EDGE-SESSION
  inherit peer-session SESSION-BASE
 exit-peer-session
 template peer-policy TO-HUB
  prefix-list HUB-ONLY in
  maximum-prefix 10
 exit-peer-policy
 neighbor 172.16.14.1 remote-as 65000
 neighbor 172.16.14.1 inherit peer-session EDGE-SESSION
 !
 address-family ipv4 unicast
  network 10.4.0.0 mask 255.255.255.0
  network 203.0.113.0 mask 255.255.255.0
  network 198.18.4.0 mask 255.255.255.0
  neighbor 172.16.14.1 activate
  neighbor 172.16.14.1 inherit peer-policy TO-HUB
 exit-address-family
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
