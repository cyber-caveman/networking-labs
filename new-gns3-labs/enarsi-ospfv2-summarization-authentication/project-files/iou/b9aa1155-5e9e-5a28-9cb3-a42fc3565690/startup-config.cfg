! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R4
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
ip vrf RED
 rd 65000:20
!
interface Ethernet0/0
 description BLUE TO-R2 AREA 10
 ip vrf forwarding BLUE
 ip address 10.255.24.2 255.255.255.252
 no shutdown
!
