 description BLUE TO-R3 AREA 10
 ip vrf forwarding BLUE
 ip address 10.255.34.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.4 255.255.255.255
 no shutdown
!
