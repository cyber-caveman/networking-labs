! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R6
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
interface Ethernet0/0
 description BLUE TO-R1 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.16.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R7 AREA 20
 ip vrf forwarding BLUE
 ip address 10.255.67.1 255.255.255.252
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.6 255.255.255.255
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
