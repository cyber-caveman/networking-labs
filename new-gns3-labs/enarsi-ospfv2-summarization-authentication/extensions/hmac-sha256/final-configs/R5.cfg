! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R5
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
ip vrf RED
 rd 65000:20
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 5.5.5.5
 passive-interface default
 no passive-interface Ethernet0/0
 area 0 authentication message-digest
 summary-address 172.20.16.0 255.255.252.0 tag 505
 summary-address 172.20.99.0 255.255.255.0 not-advertise
 redistribute connected subnets metric 40 metric-type 1 route-map CONNECTED-R5
!
router ospf 20 vrf RED
 capability vrf-lite
 router-id 20.20.20.5
 passive-interface default
 no passive-interface Ethernet1/0
 area 0 authentication message-digest
 redistribute connected subnets metric 60 metric-type 2 route-map RED-CONNECTED-R5
 summary-address 172.20.16.0 255.255.252.0 tag 1505
!
interface Ethernet0/0
 description BLUE TO-R1 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.15.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.5 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Loopback100
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.20.16.1 255.255.255.0
 no shutdown
!
interface Loopback101
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.20.17.1 255.255.255.0
 no shutdown
!
interface Loopback102
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.20.18.1 255.255.255.0
 no shutdown
!
interface Loopback103
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.20.19.1 255.255.255.0
 no shutdown
!
interface Loopback104
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.20.99.1 255.255.255.0
 no shutdown
!
interface Ethernet1/0
 description RED TO-R1 AREA 0
 ip vrf forwarding RED
 ip address 10.255.15.2 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 RedCore20
 no shutdown
!
interface Loopback1000
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 10.255.0.5 255.255.255.255
 ip ospf 20 area 0
 no shutdown
!
interface Loopback1100
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 172.20.16.1 255.255.255.0
 no shutdown
!
interface Loopback1101
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 172.20.17.1 255.255.255.0
 no shutdown
!
interface Loopback1102
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 172.20.18.1 255.255.255.0
 no shutdown
!
interface Loopback1103
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 172.20.19.1 255.255.255.0
 no shutdown
!
interface Loopback1900
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 198.51.100.5 255.255.255.255
 ip ospf 20 area 0
 no shutdown
!
interface Loopback900
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 198.18.0.5 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
ip prefix-list EXT-R5 seq 10 permit 172.20.16.0/24
ip prefix-list EXT-R5 seq 20 permit 172.20.17.0/24
ip prefix-list EXT-R5 seq 30 permit 172.20.18.0/24
ip prefix-list EXT-R5 seq 40 permit 172.20.19.0/24
ip prefix-list EXT-R5 seq 50 permit 172.20.99.0/24
!
route-map CONNECTED-R5 permit 10
 match ip address prefix-list EXT-R5
!
!
ip prefix-list RED-EXT-R5 seq 10 permit 172.20.16.0/24
ip prefix-list RED-EXT-R5 seq 20 permit 172.20.17.0/24
ip prefix-list RED-EXT-R5 seq 30 permit 172.20.18.0/24
ip prefix-list RED-EXT-R5 seq 40 permit 172.20.19.0/24
route-map RED-CONNECTED-R5 permit 10
 match ip address prefix-list RED-EXT-R5
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
