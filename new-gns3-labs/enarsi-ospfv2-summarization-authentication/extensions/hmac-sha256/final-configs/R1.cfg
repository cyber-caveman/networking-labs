! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R1
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
ip vrf RED
 rd 65000:20
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 no passive-interface Ethernet0/3
 area 0 authentication message-digest
!
router ospf 20 vrf RED
 capability vrf-lite
 router-id 20.20.20.1
 passive-interface default
 no passive-interface Ethernet1/0
 no passive-interface Ethernet1/1
 area 0 authentication message-digest
!
interface Ethernet0/0
 description BLUE TO-R2 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.12.1 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R3 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.13.1 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/2
 description BLUE TO-R5 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.15.1 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/3
 description BLUE TO-R6 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.16.1 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.1 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 description RED TO-R2 AREA 0
 ip vrf forwarding RED
 ip address 10.255.12.1 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 RedCore20
 no shutdown
!
interface Ethernet1/1
 description RED TO-R5 AREA 0
 ip vrf forwarding RED
 ip address 10.255.15.1 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 RedCore20
 no shutdown
!
interface Loopback1000
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 10.255.0.1 255.255.255.255
 ip ospf 20 area 0
 no shutdown
!
interface Loopback900
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 198.18.0.1 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
