! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R6
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
key chain OSPF20
 key 20
  key-string NssaSHA256-Lab
  cryptographic-algorithm hmac-sha-256
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 6.6.6.6
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 area 0 authentication message-digest
 area 20 nssa default-information-originate
 summary-address 172.21.32.0 255.255.252.0 tag 707
!
interface Ethernet0/0
 description BLUE TO-R1 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.16.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R7 AREA 20
 ip vrf forwarding BLUE
 ip address 10.255.67.1 255.255.255.252
 ip ospf 10 area 20
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication key-chain OSPF20
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.6 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
