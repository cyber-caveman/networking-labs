! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R3
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 no passive-interface Ethernet0/3
 area 0 authentication message-digest
 area 10 authentication
 area 10 range 10.10.0.0 255.255.252.0 cost 80
 area 10 range 10.10.4.0 255.255.254.0 cost 80
 area 10 range 10.10.250.0 255.255.255.0 not-advertise
 area 30 authentication message-digest
 area 30 stub no-summary
!
interface Ethernet0/0
 description BLUE TO-R1 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.13.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R2 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.23.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/2
 description BLUE TO-R4 AREA 10
 ip vrf forwarding BLUE
 ip address 10.255.34.1 255.255.255.252
 ip ospf 10 area 10
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication-key A10plain
 no shutdown
!
interface Ethernet0/3
 description BLUE TO-R8 AREA 30
 ip vrf forwarding BLUE
 ip address 10.255.38.1 255.255.255.252
 ip ospf 10 area 30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication null
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.3 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
