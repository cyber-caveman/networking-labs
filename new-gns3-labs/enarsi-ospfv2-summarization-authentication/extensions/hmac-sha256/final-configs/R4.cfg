! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R4
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
ip vrf RED
 rd 65000:20
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 4.4.4.4
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 area 10 authentication
!
router ospf 20 vrf RED
 capability vrf-lite
 router-id 20.20.20.4
 passive-interface default
 no passive-interface Ethernet1/0
 area 10 authentication
!
interface Ethernet0/0
 description BLUE TO-R2 AREA 10
 ip vrf forwarding BLUE
 ip address 10.255.24.2 255.255.255.252
 ip ospf 10 area 10
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication-key A10plain
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R3 AREA 10
