! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R8
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 8.8.8.8
 passive-interface default
 no passive-interface Ethernet0/0
 area 30 authentication message-digest
 area 30 stub
!
interface Ethernet0/0
 description BLUE TO-R3 AREA 30
 ip vrf forwarding BLUE
 ip address 10.255.38.2 255.255.255.252
 ip ospf 10 area 30
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication null
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.8 255.255.255.255
 ip ospf 10 area 30
 no shutdown
!
interface Loopback100
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.30.0.1 255.255.255.0
 ip ospf 10 area 30
 ip ospf network point-to-point
 no shutdown
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
