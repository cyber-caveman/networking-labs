! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R7
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 7.7.7.7
 passive-interface default
 no passive-interface Ethernet0/0
 area 20 nssa
 redistribute connected subnets metric 30 metric-type 2 tag 707 route-map CONNECTED-R7
 summary-address 172.21.32.0 255.255.252.0 tag 707
!
interface Ethernet0/0
 description BLUE TO-R6 AREA 20
 ip vrf forwarding BLUE
 ip address 10.255.67.2 255.255.255.252
 ip ospf 10 area 20
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication message-digest
 ip ospf message-digest-key 7 md5 NssaKey7
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.7 255.255.255.255
 ip ospf 10 area 20
 no shutdown
!
interface Loopback100
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.21.32.1 255.255.255.0
 no shutdown
!
interface Loopback101
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.21.33.1 255.255.255.0
 no shutdown
!
interface Loopback102
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.21.34.1 255.255.255.0
 no shutdown
!
interface Loopback103
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 172.21.35.1 255.255.255.0
 no shutdown
!
ip prefix-list EXT-R7 seq 10 permit 172.21.32.0/24
ip prefix-list EXT-R7 seq 20 permit 172.21.33.0/24
ip prefix-list EXT-R7 seq 30 permit 172.21.34.0/24
ip prefix-list EXT-R7 seq 40 permit 172.21.35.0/24
!
route-map CONNECTED-R7 permit 10
 match ip address prefix-list EXT-R7
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
