! OSPFv2 VRF-Lite Summarization and Authentication Lab
hostname R2
no ip domain-lookup
ip cef
!
ip vrf BLUE
 rd 65000:10
!
ip vrf RED
 rd 65000:20
!
router ospf 10 vrf BLUE
 capability vrf-lite
 router-id 2.2.2.2
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 area 0 authentication message-digest
 area 10 authentication
 area 10 range 10.10.0.0 255.255.252.0 cost 50
 area 10 range 10.10.4.0 255.255.254.0 cost 50
 area 10 range 10.10.250.0 255.255.255.0 not-advertise
!
router ospf 20 vrf RED
 capability vrf-lite
 router-id 20.20.20.2
 passive-interface default
 no passive-interface Ethernet1/0
 no passive-interface Ethernet1/1
 area 0 authentication message-digest
 area 10 authentication
 area 10 range 10.10.0.0 255.255.252.0 cost 70
!
interface Ethernet0/0
 description BLUE TO-R1 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.12.2 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/1
 description BLUE TO-R3 AREA 0
 ip vrf forwarding BLUE
 ip address 10.255.23.1 255.255.255.252
 ip ospf 10 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 CoreNew20
 no shutdown
!
interface Ethernet0/2
 description BLUE TO-R4 AREA 10
 ip vrf forwarding BLUE
 ip address 10.255.24.1 255.255.255.252
 ip ospf 10 area 10
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication-key A10plain
 no shutdown
!
interface Loopback0
 description BLUE LAB PREFIX
 ip vrf forwarding BLUE
 ip address 10.255.0.2 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 description RED TO-R1 AREA 0
 ip vrf forwarding RED
 ip address 10.255.12.2 255.255.255.252
 ip ospf 20 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf message-digest-key 20 md5 RedCore20
 no shutdown
!
interface Ethernet1/1
 description RED TO-R4 AREA 10
 ip vrf forwarding RED
 ip address 10.255.24.1 255.255.255.252
 ip ospf 20 area 10
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf authentication-key RedPlain
 no shutdown
!
interface Loopback1000
 description RED LAB PREFIX
 ip vrf forwarding RED
 ip address 10.255.0.2 255.255.255.255
 ip ospf 20 area 0
 no shutdown
!
!
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
