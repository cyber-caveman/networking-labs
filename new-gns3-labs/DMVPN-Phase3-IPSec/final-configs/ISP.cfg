hostname ISP
!
ip cef
!
interface Ethernet0/0
 ip address 172.16.11.254 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 ip address 172.16.31.254 255.255.255.0
 no shutdown
!
interface Ethernet0/2
 ip address 172.16.41.254 255.255.255.0
 no shutdown
!
ip prefix-list FROM-R11 seq 10 permit 172.16.11.0/24
ip prefix-list TO-R11 seq 10 permit 172.16.31.0/24
ip prefix-list TO-R11 seq 20 permit 172.16.41.0/24
ip prefix-list FROM-R31 seq 10 permit 172.16.31.0/24
ip prefix-list TO-R31 seq 10 permit 172.16.11.0/24
ip prefix-list TO-R31 seq 20 permit 172.16.41.0/24
ip prefix-list FROM-R41 seq 10 permit 172.16.41.0/24
ip prefix-list TO-R41 seq 10 permit 172.16.11.0/24
ip prefix-list TO-R41 seq 20 permit 172.16.31.0/24
!
router bgp 65000
 bgp router-id 172.16.11.254
 no bgp default ipv4-unicast
 neighbor 172.16.11.1 remote-as 65111
 neighbor 172.16.31.1 remote-as 65131
 neighbor 172.16.41.1 remote-as 65141
 address-family ipv4
  network 172.16.11.0 mask 255.255.255.0
  neighbor 172.16.11.1 activate
  neighbor 172.16.11.1 prefix-list FROM-R11 in
  neighbor 172.16.11.1 prefix-list TO-R11 out
  network 172.16.31.0 mask 255.255.255.0
  neighbor 172.16.31.1 activate
  neighbor 172.16.31.1 prefix-list FROM-R31 in
  neighbor 172.16.31.1 prefix-list TO-R31 out
  network 172.16.41.0 mask 255.255.255.0
  neighbor 172.16.41.1 activate
  neighbor 172.16.41.1 prefix-list FROM-R41 in
  neighbor 172.16.41.1 prefix-list TO-R41 out
 exit-address-family
!
end
