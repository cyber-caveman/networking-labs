hostname R31
!
ip cef
!
vrf definition FVRF-INTERNET
 rd 65131:100
 address-family ipv4
 exit-address-family
!
crypto ikev2 proposal DMVPN-PROPOSAL
 encryption aes-cbc-256
 integrity sha1
 prf sha1
 group 14
!
crypto ikev2 policy DMVPN-POLICY
 match fvrf FVRF-INTERNET
 proposal DMVPN-PROPOSAL
!
crypto ikev2 keyring DMVPN-KEYRING
 peer DMVPN-PEERS
  address 0.0.0.0 0.0.0.0
  pre-shared-key local ENARSI-DMVPN-2026
  pre-shared-key remote ENARSI-DMVPN-2026
!
crypto ikev2 profile DMVPN-IKE
 match fvrf FVRF-INTERNET
 match identity remote address 0.0.0.0 0.0.0.0
 identity local address 172.16.31.1
 authentication local pre-share
 authentication remote pre-share
 keyring local DMVPN-KEYRING
 lifetime 86400
!
crypto ipsec transform-set DMVPN-TS esp-aes 256 esp-sha-hmac
 mode transport
!
crypto ipsec profile DMVPN-IPSEC
 set transform-set DMVPN-TS
 set ikev2-profile DMVPN-IKE
!
interface Ethernet0/0
 vrf forwarding FVRF-INTERNET
 ip address 172.16.31.1 255.255.255.0
 no shutdown
!
interface Loopback0
 ip address 10.3.3.1 255.255.255.0
 ip ospf network point-to-point
 ip ospf 100 area 0
 no shutdown
!
interface Tunnel0
 ip address 192.168.100.31 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip ospf network point-to-multipoint
 ip ospf 100 area 0
 ip tcp adjust-mss 1360
 ip nhrp authentication ENARSI
 ip nhrp network-id 100
 ip nhrp map 192.168.100.11 172.16.11.1
 ip nhrp map multicast 172.16.11.1
 ip nhrp nhs 192.168.100.11
 ip nhrp shortcut
 tunnel source Ethernet0/0
 tunnel mode gre multipoint
 tunnel vrf FVRF-INTERNET
 tunnel key 100
 tunnel protection ipsec profile DMVPN-IPSEC
 no shutdown
!
ip prefix-list OSPF-RIB seq 10 deny 192.168.100.0/24 ge 32
ip prefix-list OSPF-RIB seq 20 permit 0.0.0.0/0 le 32
!
ip prefix-list TO-ISP seq 10 permit 172.16.31.0/24
ip prefix-list FROM-ISP seq 10 permit 172.16.11.0/24
ip prefix-list FROM-ISP seq 20 permit 172.16.41.0/24
!
router ospf 100
 router-id 10.3.3.1
 passive-interface default
 no passive-interface Tunnel0
 distribute-list prefix OSPF-RIB in
!
router bgp 65131
 bgp router-id 10.3.3.1
 no bgp default ipv4-unicast
 address-family ipv4 vrf FVRF-INTERNET
  network 172.16.31.0 mask 255.255.255.0
  neighbor 172.16.31.254 remote-as 65000
  neighbor 172.16.31.254 activate
  neighbor 172.16.31.254 prefix-list FROM-ISP in
  neighbor 172.16.31.254 prefix-list TO-ISP out
 exit-address-family
!
end
