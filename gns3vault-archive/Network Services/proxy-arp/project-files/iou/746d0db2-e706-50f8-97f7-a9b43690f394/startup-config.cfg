!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Medusa
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip routing
!
!
no ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 172.16.0.1 255.255.0.0
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
