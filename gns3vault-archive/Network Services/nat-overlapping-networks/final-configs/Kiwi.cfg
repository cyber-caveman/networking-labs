!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Kiwi
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.34.4 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.1.4 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
ip nat inside source static 192.168.1.1 192.168.34.101
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
