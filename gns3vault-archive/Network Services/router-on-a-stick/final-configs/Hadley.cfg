!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Hadley
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip routing
no ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 ip address 192.168.3.1 255.255.255.0
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 no ip route-cache
 shutdown
 bandwidth 100000
 delay 10
!
ip default-gateway 192.168.3.254
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
