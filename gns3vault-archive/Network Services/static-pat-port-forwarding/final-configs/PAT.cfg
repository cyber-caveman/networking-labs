!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname PAT
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.123.4 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.45.4 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
ip nat inside source list INSIDE interface Ethernet0/1 overload
ip nat inside source static tcp 192.168.123.2 25 192.168.45.4 25 extendable
ip nat inside source static tcp 192.168.123.1 80 192.168.45.4 80 extendable
!
!
ip access-list standard INSIDE
 permit 192.168.123.0 0.0.0.255
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
