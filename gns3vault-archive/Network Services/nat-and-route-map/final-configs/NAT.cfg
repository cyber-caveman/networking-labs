!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname NAT
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.23.2 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 no shutdown
!
interface Serial4/1
 ip address 192.168.24.2 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 no shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
no ip http server
no ip http secure-server
!
!
ip nat inside source route-map PARTNER interface Serial4/1 overload
ip nat inside source route-map WWW interface Serial4/0 overload
!
!
route-map PARTNER permit 10
 match interface Serial4/1
!
route-map WWW permit 10
 match interface Serial4/0
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
