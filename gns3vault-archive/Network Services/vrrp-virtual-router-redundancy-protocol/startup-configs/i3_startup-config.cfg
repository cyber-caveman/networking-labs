!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname HOST
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip routing
no ip cef
!
!
!
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 ip address 192.168.1.200 255.255.255.0
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address 
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
ip forward-protocol nd
!
!
ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
