!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname NAT
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.23.2 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
ip nat inside source list 1 interface Ethernet0/1 overload
ip nat inside source static 192.168.12.1 192.168.23.20 extendable
ip nat inside source static 192.168.12.1 192.168.23.21 extendable
!
access-list 1 permit 192.168.12.0
access-list 1 permit 192.168.12.0 0.0.0.255
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
