ip sla 1
 icmp-echo 4.4.4.4
 timeout 5000
 frequency 9
ip sla schedule 1 life forever start-time now
ip sla 5
 http raw http://192.168.34.4/level/1/exec source-ip 1.1.1.1
 timeout 5000
 frequency 60
 http-raw-request
 GET /level/1/exec HTTP/1.0\r\n
 Host: 192.168.34.4\r\n
 Authorization: Basic c2xhLWh0dHA6U2xhTGFiSFRUUDE=\r\n
 \r\n
ip sla schedule 5 life forever start-time now
