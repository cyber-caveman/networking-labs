!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Pickle
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
ip sla responder
ip sla 3
 udp-jitter 2.2.2.2 16384 codec g711alaw codec-size 160 codec-interval 20
 timeout 5000
 frequency 60
ip sla schedule 3 life forever start-time now
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.34.3 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.13.3 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 0.0.0.0 255.255.255.255 area 0
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
