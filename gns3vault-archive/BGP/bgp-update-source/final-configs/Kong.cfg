!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.122.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.112.2 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router eigrp 100
 network 2.0.0.0
 network 192.168.112.0
 network 192.168.122.0
 no auto-summary
!
router bgp 100
 no synchronization
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback0
 no auto-summary
!
ip http server
no ip http secure-server
!
