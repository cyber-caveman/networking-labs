!
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.0
!
interface Serial4/0
 ip address 192.168.25.5 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.35.5 255.255.255.0
 half-duplex
 bandwidth 10000
 delay 100
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
interface Ethernet0/2
 no ip address
 shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
interface Ethernet0/3
 no ip address
 shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
interface Ethernet0/0
 ip address 192.168.45.5 255.255.255.0
 bandwidth 10000
 delay 100
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 5.5.5.0 0.0.0.255 area 0
 network 192.168.45.0 0.0.0.255 area 0
!
router bgp 2
 no synchronization
 bgp log-neighbor-changes
 network 192.168.45.0
 neighbor 4.4.4.4 remote-as 2
 neighbor 4.4.4.4 update-source Loopback0
 neighbor 192.168.25.2 remote-as 1
 neighbor 192.168.35.3 remote-as 1
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
