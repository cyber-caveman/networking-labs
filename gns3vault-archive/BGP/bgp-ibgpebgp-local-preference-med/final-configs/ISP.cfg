interface Loopback0
 ip address 4.4.4.4 255.255.255.0
!
interface Serial4/0
 ip address 192.168.24.4 255.255.255.0
 no shutdown
!
interface Serial4/1
 ip address 192.168.34.4 255.255.255.0
 no shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
