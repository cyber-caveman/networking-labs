!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
interface Serial4/0
 no ip address
 encapsulation frame-relay
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 encapsulation frame-relay
 shutdown
 frame-relay lmi-type ansi
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
no ip http server
no ip http secure-server
!
