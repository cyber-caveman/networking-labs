!
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SW2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
system mtu routing 1900
ip subnet-zero

port-channel load-balance dst-mac
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan internal allocation policy ascending

!
!
interface Port-channel12
!
interface Port-channel23
!
interface Ethernet1/0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/1
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/3
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet2/0
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet2/1
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet2/2
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet2/3
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet3/0
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet3/1
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet3/2
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet3/3
 bandwidth 100000
 delay 10
 no shutdown

interface Ethernet0/0
 channel-group 12 mode auto
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 channel-group 12 mode auto
 bandwidth 100000
 delay 10
 no shutdown
!
!
interface Ethernet0/2
 channel-group 23 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/3
 channel-group 23 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
!
interface Vlan1
 no ip address
!
ip classless
ip http server
ip http secure-server
!
!
!
control-plane
!
!
line con 0
line vty 5 15
!         
end
