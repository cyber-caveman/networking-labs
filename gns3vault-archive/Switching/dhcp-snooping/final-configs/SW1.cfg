hostname SW1
spanning-tree mode pvst
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
system mtu routing 1900
ip subnet-zero
!
ip dhcp snooping vlan 1
no ip dhcp snooping information option
ip dhcp snooping
!         
interface Ethernet0/1
 description CLIENT
 ip dhcp snooping limit rate 10
 bandwidth 100000
 delay 10
 no shutdown
!         
interface Ethernet0/2
 description DHCPSERVER
 ip dhcp snooping trust
 bandwidth 100000
 delay 10
 no shutdown
end
