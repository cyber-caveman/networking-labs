hostname Jarvis
!
ip cef
!
interface Ethernet0/0
 ip address 192.168.23.3 255.255.255.0
 no shutdown
 bandwidth 100000
 delay 10
!
interface Ethernet0/1
 ip address 192.168.34.3 255.255.255.0
 no shutdown
 bandwidth 100000
 delay 10
!
router eigrp 1
 network 192.168.0.0 0.0.255.255
 no auto-summary
!
end
