interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
interface Serial4/0
 ip address 192.168.12.2 255.255.255.0
 encapsulation frame-relay
 frame-relay map ip 192.168.12.1 201
 no frame-relay inverse-arp
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
 neighbor 192.168.12.1 Serial4/0
!
ip http server
no ip http secure-server
