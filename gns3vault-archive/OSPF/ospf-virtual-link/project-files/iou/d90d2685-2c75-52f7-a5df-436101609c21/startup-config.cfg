!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Fish
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ip domain lookup
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.24.4 255.255.255.0
 bandwidth 100000
 no shutdown
!
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
end
