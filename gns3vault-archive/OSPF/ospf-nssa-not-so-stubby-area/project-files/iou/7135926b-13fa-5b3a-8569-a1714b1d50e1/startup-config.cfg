!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Wodan
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
interface Serial4/0
 ip address 192.168.12.1 255.255.255.0
 no shutdown
!
interface Serial4/1
 ip address 192.168.13.1 255.255.255.0
 no shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
ip http server
no ip http secure-server
!
control-plane
!
line con 0
line vty 0 4
!
end
