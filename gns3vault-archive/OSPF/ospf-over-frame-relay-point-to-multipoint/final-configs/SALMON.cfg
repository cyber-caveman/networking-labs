
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SALMON
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
!
interface Serial4/0
 no ip address
 encapsulation frame-relay
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
ip http server
no ip http secure-server
!
control-plane
!
line con 0
line vty 0 4
!
end
