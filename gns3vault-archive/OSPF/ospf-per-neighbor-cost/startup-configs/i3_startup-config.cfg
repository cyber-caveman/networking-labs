!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname HERRING
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
!
interface Serial4/0
 ip address 192.168.123.3 255.255.255.0
 encapsulation frame-relay
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
ip http server
no ip http secure-server
!
control-plane
!
line con 0
line vty 0 4
 login
!
end
