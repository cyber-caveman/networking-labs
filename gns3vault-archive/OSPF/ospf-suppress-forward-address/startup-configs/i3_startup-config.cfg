!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Charlie
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ip domain lookup
!
interface Ethernet0/0
 ip address 192.168.13.3 255.255.255.0
 bandwidth 100000
 no shutdown
!
interface Serial4/0
 ip address 192.168.35.3 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
end
