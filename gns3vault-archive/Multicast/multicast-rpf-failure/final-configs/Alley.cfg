interface Serial4/0
 ip address 192.168.24.4 255.255.255.0
 ip pim dense-mode
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.45.4 255.255.255.0
 ip pim dense-mode
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 0.0.0.0 255.255.255.255 area 0
!
ip http server
no ip http secure-server
!
!
ip mroute 0.0.0.0 0.0.0.0 Serial4/0
