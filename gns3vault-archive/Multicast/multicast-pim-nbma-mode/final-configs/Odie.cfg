interface Serial4/0
 ip address 192.168.234.2 255.255.255.0
 ip pim sparse-mode
 encapsulation frame-relay
 frame-relay map ip 192.168.234.3 204 broadcast
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 ip pim sparse-mode
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 100
 network 192.168.12.0
 network 192.168.234.0
 no auto-summary
!
ip http server
no ip http secure-server
!
