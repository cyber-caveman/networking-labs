!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Compact
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
bridge irb
!
!
!
interface Serial4/0
 no ip address
 encapsulation frame-relay
 frame-relay map bridge 102 broadcast
 bridge-group 1
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 no ip address
 bridge-group 1
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
bridge 1 protocol ieee
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
