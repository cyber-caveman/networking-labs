!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Emma
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Serial4/0
 ip address 192.168.12.2 255.255.255.0
 encapsulation frame-relay
 frame-relay interface-dlci 201
  class KEEPALIVE
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
no ip http server
no ip http secure-server
!
!
!
!
map-class frame-relay KEEPALIVE
 frame-relay end-to-end keepalive mode request
 frame-relay end-to-end keepalive timer send 3
 frame-relay end-to-end keepalive event-window send 6
 frame-relay end-to-end keepalive error-threshold send 5
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
