!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Compact
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Serial4/0
 no ip address
 encapsulation frame-relay
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/0.102 point-to-point
 ip address 192.168.23.2 255.255.255.0
 frame-relay interface-dlci 102   
 frame-relay ip rtp header-compression
 no shutdown
!
interface Serial4/0.112 point-to-point
 ip address 192.168.32.2 255.255.255.0
 frame-relay interface-dlci 112   
 frame-relay ip tcp header-compression
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
ip route 192.168.34.0 255.255.255.0 192.168.32.3
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
