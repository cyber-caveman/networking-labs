!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Wilma
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
interface Ethernet0/0
 ip address 10.10.12.2 255.255.255.0
 ip rip send version 1 2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 10.10.24.2 255.255.255.0
 ip rip triggered
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router rip
 version 2
 timers basic 30 180 0 240
 passive-interface Serial4/0
 offset-list 1 in 5 Serial4/0
 network 0.0.0.0
 neighbor 10.10.24.4
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
access-list 1 permit 4.4.4.0 0.0.0.255
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
