interface Loopback0
 ip address 1.1.1.1 255.255.255.0
 ip rip advertise 10
!
interface Ethernet0/0
 ip address 192.168.12.1 255.255.255.0
 ip rip advertise 10
 bandwidth 100000
 delay 10
 no shutdown
!
router rip
 version 2
 timers basic 10 180 180 240
 passive-interface Loopback0
 network 1.0.0.0
 network 192.168.12.0
 no auto-summary
!
ip http server
no ip http secure-server
