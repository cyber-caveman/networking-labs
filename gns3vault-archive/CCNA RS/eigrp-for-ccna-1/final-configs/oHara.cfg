!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname oHara
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 delay 1
 bandwidth 100000
 no shutdown
!
interface Ethernet0/1
 bandwidth 10
 ip address 192.168.21.2 255.255.255.0
 delay 1
 no shutdown
!
interface Serial4/0
 ip address 192.168.25.2 255.255.255.0
 delay 1
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router eigrp 1
 network 2.2.2.0 0.0.0.255
 network 192.168.12.0
 network 192.168.21.0
 network 192.168.25.0
 metric weights 0 0 0 1 0 0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
