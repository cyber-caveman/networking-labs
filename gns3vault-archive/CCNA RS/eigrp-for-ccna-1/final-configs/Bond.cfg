!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Bond
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.0
!
interface Serial4/0
 ip address 192.168.134.3 255.255.255.0
 encapsulation frame-relay
 frame-relay map ip 192.168.134.4 301 broadcast
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router eigrp 1
 network 3.3.3.0 0.0.0.255
 network 192.168.134.0
 metric weights 0 0 0 1 0 0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
