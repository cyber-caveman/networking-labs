!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Bird
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.56.5 255.255.255.0
 ip ospf authentication
 ip ospf authentication-key VAULT
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.65.5 255.255.255.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 GNS3VAULT
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/1
 ip address 192.168.45.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 5.5.5.0 0.0.0.255 area 1
 network 192.168.45.0 0.0.0.255 area 1
 network 192.168.56.0 0.0.0.255 area 1
 network 192.168.65.0 0.0.0.255 area 1
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
