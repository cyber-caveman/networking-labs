!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R6
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.56.6 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.67.6 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 no ip address
 shutdown
 no fair-queue
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 area 56 nssa
 area 56 range 172.16.0.0 255.255.0.0
 summary-address 172.16.0.0 255.255.252.0
 redistribute rip metric-type 1 subnets
 network 6.6.6.0 0.0.0.255 area 56
 network 192.168.56.0 0.0.0.255 area 56
!
router rip
 version 2
 redistribute ospf 1 metric 2
 network 192.168.67.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
access-list 20 permit 1.1.1.0 0.0.0.255
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
