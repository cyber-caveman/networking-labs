!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
interface Serial4/0
 ip address 192.168.123.1 255.255.255.0
 encapsulation frame-relay
 ip ospf network broadcast
 ip ospf priority 10
 frame-relay map ip 192.168.123.2 102 broadcast
 frame-relay map ip 192.168.123.3 103 broadcast
 no frame-relay inverse-arp
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.12.1 255.255.255.0
 ip ospf cost 5000
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.145.1 255.255.255.0
 ip ospf network broadcast
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 area 51 virtual-link 5.5.5.5
 area 51 virtual-link 4.4.4.4
 network 1.1.1.0 0.0.0.255 area 0
 network 192.168.12.0 0.0.0.255 area 0
 network 192.168.123.0 0.0.0.255 area 0
 network 192.168.145.0 0.0.0.255 area 51
!
ip http server
no ip http secure-server
!
!
!
access-list 13 permit 5.5.5.0 0.0.0.255
!
route-map pietje permit 10
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
