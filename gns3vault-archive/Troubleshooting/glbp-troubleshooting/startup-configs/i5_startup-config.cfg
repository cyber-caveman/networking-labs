interface Ethernet0/0
 mac-address 0000.0000.0002
 ip address 7.7.7.2 254.0.0.0
 ip access-group BLOCK in
 glbp 7 ip 77.77.77.77
 glbp 7 timers msec 50 msec 500
 glbp 7 preempt
 glbp 7 load-balancing host-dependent
 glbp 7 authentication text vault
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.25.2 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router ospf 7
 log-adjacency-changes
 passive-interface Ethernet0/0
 network 0.0.0.0 255.255.255.255 area 7
!
ip http server
no ip http secure-server
!
!
!
!
ip access-list extended BLOCK
 deny   ip any 224.0.0.0 0.255.255.255
 permit ip any any
!
!
!
control-plane
!
