!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DSW2
spanning-tree mode pvst
ip routing
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip cef
!
!
!
!
no ip domain lookup
ip domain name lab.local
ipv6 unicast-routing
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree vlan 10 priority 16384
spanning-tree vlan 20 priority 8192
spanning-tree vlan 200 priority 16384
vtp mode transparent
archive
 log config
  hidekeys
! 
!
!
!
vlan 10,20,200 
!
!
!
!
!
interface Port-channel2
 switchport mode trunk
!
interface Port-channel3
 switchport mode trunk
!
interface Port-channel4
 switchport mode trunk
!
interface Ethernet0/0
 no switchport
 ip address 10.1.4.10 255.255.255.252
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
!
interface Ethernet0/1
 no switchport
 no ip address
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
interface Ethernet0/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/3
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/1
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/2
 switchport mode trunk
 channel-group 3 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/3
 switchport mode trunk
 channel-group 3 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/0
 switchport mode trunk
 channel-group 4 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/1
 switchport mode trunk
 channel-group 4 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/3
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/0
 switchport mode trunk
 channel-group 2 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/1
 switchport mode trunk
 channel-group 2 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/3
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
interface Vlan1
 no ip address
!
interface Vlan10
 ip address 10.2.1.2 255.255.255.0
 ipv6 address FE80::C11B:13FF:FEF0:0 link-local
 ipv6 address 2026::3:2/122
 ipv6 rip RIPNG enable
 standby 10 ip 10.2.1.254
 standby 10 priority 120
 standby 10 preempt
!
interface Vlan20
 ip address 10.2.2.1 255.255.255.0
!
interface Vlan200
 ip address 192.168.1.130 255.255.255.224
!
router eigrp 10
 network 10.1.4.8 0.0.0.3
 network 10.2.1.0 0.0.0.255
 network 10.2.2.0 0.0.0.255
 network 192.168.1.128 0.0.0.31
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
mac-address-table static c20b.1ef6.0000 interface Ethernet3/0 vlan 1
mac-address-table static c20b.1ef6.0000 interface Ethernet3/0 vlan 10
mac-address-table static c20b.1ef6.0000 interface Ethernet3/0 vlan 20
mac-address-table static c20b.1ef6.0000 interface Ethernet3/0 vlan 200
ipv6 router rip RIPNG
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
