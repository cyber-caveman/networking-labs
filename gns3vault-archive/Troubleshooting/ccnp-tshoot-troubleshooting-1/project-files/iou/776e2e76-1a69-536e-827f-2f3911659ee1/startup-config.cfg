!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname WebServer
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip routing
no ip cef
!
!
!
!
no ip domain lookup
ip domain name lab.local
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 209.65.200.241 255.255.255.248
 no ip route-cache
 clock rate 2000000
 no shutdown
!
interface Ethernet0/1
 no ip address
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/2
 no ip address
 no ip route-cache
 clock rate 2000000
 no shutdown
!
ip default-gateway 209.65.200.246
ip forward-protocol nd
!
!
ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
