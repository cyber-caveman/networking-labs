!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Client2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
no ip routing
no ip cef
!
!
!
!
no ip domain lookup
ip domain name lab.local
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 ip address dhcp
 no ip route-cache
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 no ip route-cache
 bandwidth 100000
 delay 10
 no shutdown
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
