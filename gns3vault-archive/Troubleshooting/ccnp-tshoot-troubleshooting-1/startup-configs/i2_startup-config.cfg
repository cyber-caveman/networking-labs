!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ASW2
spanning-tree mode pvst
ip routing
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip cef
!
!
!
!
no ip domain lookup
ip domain name lab.local
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
vtp mode transparent
archive
 log config
  hidekeys
! 
!
!
!
vlan 10,20,200 
!
!
!
!
!
interface Port-channel5
 switchport mode trunk
!
interface Port-channel4
 switchport mode trunk
!
interface Ethernet0/0
 no switchport
 no ip address
 bandwidth 100000
 delay 10
 no shutdown
!
!
interface Ethernet0/1
 no switchport
 no ip address
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
interface Ethernet0/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/3
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/1
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/2
 switchport access vlan 20
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/3
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/0
 switchport mode trunk
 channel-group 4 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/1
 switchport mode trunk
 channel-group 4 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/2
 switchport mode trunk
 channel-group 5 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet2/3
 switchport mode trunk
 channel-group 5 mode on
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/1
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet3/3
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
interface Vlan1
 no ip address
!
interface Vlan200
 ip address 192.168.1.132 255.255.255.224
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
