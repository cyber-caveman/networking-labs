!
interface Vlan1
 no ip address
!
interface Vlan10
 ip address 10.2.1.1 255.255.255.0
 ipv6 address FE80::C00B:13FF:FEE1:1 link-local
 ipv6 address 2026::3:1/122
 ipv6 rip RIPNG enable
 standby 10 ip 10.2.1.200
 standby 10 priority 200
 standby 10 preempt
!
interface Vlan20
 ip address 10.2.2.2 255.255.255.0
!
interface Vlan200
 ip address 192.168.1.129 255.255.255.224
!
router eigrp 10
 network 10.1.4.4 0.0.0.3
 network 10.2.1.0 0.0.0.255
 network 10.2.2.0 0.0.0.255
 network 192.168.1.128 0.0.0.31
 auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
mac-address-table static c20a.1ee7.0000 interface Ethernet1/0 vlan 1
mac-address-table static c20a.1ee7.0000 interface Ethernet1/0 vlan 10
mac-address-table static c20a.1ee7.0000 interface Ethernet1/0 vlan 20
mac-address-table static c20a.1ee7.0000 interface Ethernet1/0 vlan 200
ipv6 router rip RIPNG
!
