 ipv6 rip RIPNG enable
 bandwidth 100000
 delay 10
 no shutdown
!
!
interface Ethernet0/1
 no switchport
 no ip address
 bandwidth 100000
 delay 10
 no shutdown
!
!
!
interface Ethernet0/2
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/3
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet1/0
 switchport mode trunk
