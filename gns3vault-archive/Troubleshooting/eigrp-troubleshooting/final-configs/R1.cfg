!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
interface Loopback1
 ip address 11.11.11.11 255.255.255.0
!
interface Serial4/0
 ip address 192.168.123.1 255.255.255.0
 encapsulation frame-relay
 no ip split-horizon eigrp 123
 frame-relay map ip 192.168.123.2 102 broadcast
 frame-relay map ip 192.168.123.3 103 broadcast
 no frame-relay inverse-arp
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 172.17.145.1 255.255.255.0 secondary
 ip address 172.16.145.1 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 123
 network 1.1.1.0 0.0.0.255
 network 11.0.0.0
 network 192.168.123.0
 no auto-summary
!
router eigrp 145
 network 1.0.0.0
 network 172.16.0.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
access-list 10 permit 1.0.0.0 0.255.255.255
access-list 10 permit 192.168.0.0 0.0.255.255
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
 login
!
!
end
