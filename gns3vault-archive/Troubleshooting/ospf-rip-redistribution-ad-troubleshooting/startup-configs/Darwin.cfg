!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Darwin
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.35.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.45.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router rip
 version 2
 network 5.0.0.0
 network 192.168.35.0
 network 192.168.45.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
