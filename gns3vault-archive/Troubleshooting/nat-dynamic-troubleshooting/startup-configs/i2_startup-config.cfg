!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Jamaica
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 ip nat outside
 ip virtual-reassembly
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.23.2 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router rip
 version 2
 network 192.168.23.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
ip nat pool NATPOOL 172.16.1.1 172.16.1.10 netmask 255.255.255.0
ip nat inside source list 1 pool NATPOOL
!
access-list 1 permit 0.0.0.0 255.255.255.0
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
