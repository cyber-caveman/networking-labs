!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SpokeB
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
ip multicast-routing 
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Tunnel23
 ip address 23.23.23.3 255.255.255.0
 ip pim dense-mode
 ip ospf cost 500
 tunnel source 192.168.123.3
 tunnel destination 192.168.123.2
!
interface Serial4/0
 ip address 192.168.123.3 255.255.255.0
 ip pim dense-mode
 encapsulation frame-relay
 ip ospf network broadcast
 ip ospf priority 0
 frame-relay map ip 192.168.123.2 201 broadcast
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.34.3 255.255.255.0
 ip pim dense-mode
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 0.0.0.0 255.255.255.255 area 0
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
