!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Prio
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
class-map match-all HTTP
 match access-group name HTTP
!
!
policy-map HTTP
 class HTTP
  set dscp af41
!
! 
!
!
!
!
interface Serial4/0
 ip address 192.168.23.2 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 service-policy input HTTP
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
!
ip access-list extended HTTP
 permit tcp any any eq www
 permit icmp any any
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
