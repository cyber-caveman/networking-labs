!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Line
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
class-map match-all AF41
 match  dscp af41 
!
!
policy-map WRED
 class AF41
  bandwidth 128
  random-detect dscp-based
  random-detect dscp 34   8     32    8    
!
! 
!
!
!
!
interface Serial4/0
 ip address 192.168.23.3 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 bandwidth 256
 ip address 192.168.34.3 255.255.255.0
 service-policy output WRED
 delay 10
 no shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
