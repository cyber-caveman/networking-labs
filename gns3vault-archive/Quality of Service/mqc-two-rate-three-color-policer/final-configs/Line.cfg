!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Line
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
class-map match-all TELNET
 match protocol telnet
!
!
policy-map POLICER
 class TELNET
   police cir 64000 pir 128000
     conform-action set-dscp-transmit af21
     exceed-action set-dscp-transmit 0
     violate-action drop 
!
! 
!
!
!
!
interface Serial4/0
 ip address 192.168.23.3 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.34.3 255.255.255.0
 service-policy output POLICER
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
