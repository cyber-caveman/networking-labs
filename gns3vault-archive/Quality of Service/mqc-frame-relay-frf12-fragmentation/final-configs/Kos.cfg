!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.23.2 255.255.255.0
 encapsulation frame-relay
 frame-relay fragment 200 end-to-end
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
