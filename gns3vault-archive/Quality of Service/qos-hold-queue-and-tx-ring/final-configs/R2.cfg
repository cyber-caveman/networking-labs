interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 tx-ring-limit 20
 tx-queue-limit 20
 hold-queue 12 in
 hold-queue 24 out
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.23.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 0.0.0.0 255.255.255.255 area 0
!
ip http server
no ip http secure-server
