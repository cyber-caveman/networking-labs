!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Frank
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
ip sla monitor 1
 type jitter dest-ipaddr 192.168.34.4 dest-port 16700 codec g711ulaw codec-numpackets 50 codec-size 160
 timeout 0
 frequency 1
ip sla monitor schedule 1 life forever start-time now
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.12.1 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
