interface Serial4/0
 bandwidth 64
 no ip address
 encapsulation ppp
 ppp multilink
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Ethernet0/0
 ip address 192.168.34.3 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Virtual-Template1
 bandwidth 64
 ip address 192.168.23.3 255.255.255.0
 fair-queue 64 256 0
 ppp multilink fragment delay 10
 ppp multilink interleave
