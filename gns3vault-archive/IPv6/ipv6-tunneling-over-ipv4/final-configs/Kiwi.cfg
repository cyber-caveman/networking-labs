!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Kiwi
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 no ip address
 ipv6 address 4000::/64 eui-64
 ipv6 enable
 ipv6 rip TAG enable
 bandwidth 100000
 delay 10
 no shutdown
!
no ip http server
no ip http secure-server
!
!
!
ipv6 router rip TAG
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
