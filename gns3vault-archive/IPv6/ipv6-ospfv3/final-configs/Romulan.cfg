!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Romulan
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
!
!
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 no ip address
 ipv6 address 2001::2/128
 ipv6 ospf 1 area 0
!
interface Ethernet0/0
 no ip address
 ipv6 enable
 ipv6 ospf 1 area 0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 ipv6 enable
 ipv6 ospf 1 area 0
 bandwidth 100000
 delay 10
 no shutdown
!
ip http server
no ip http secure-server
!
!
!
ipv6 router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line vty 0 4
!
!
end
