!

!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Silver
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 ipv6 address 2001:A:B:C::/64 eui-64
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 route ::/0 2001:A:B:C:C002:12FF:FE79:1
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
