interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.12.1 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.15.1 255.255.255.0
 no shutdown
!
interface Serial4/1
 no ip address
