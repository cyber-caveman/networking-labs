!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CENTRALSERVER
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.0
!
interface Loopback1
 ip address 99.99.99.99 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.39.9 255.255.255.0
 no shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
interface Ethernet0/1
 no ip address
 half-duplex
 bandwidth 10000
 delay 100
 no shutdown
!
interface Ethernet0/2
 no ip address
 shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
interface Ethernet0/3
 no ip address
 shutdown
 half-duplex
 bandwidth 10000
 delay 100
!
!
ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
line vty 0 4
 login
!
!
end
