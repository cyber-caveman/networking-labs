!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname P1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
mpls label range 20 200
mpls ip default-route
mpls ldp neighbor 3.3.3.3 password VAULT
mpls ldp neighbor 2.2.2.2 password VAULT
mpls ldp discovery hello interval 2
mpls ldp discovery hello holdtime 10
mpls ldp maxhops 10
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface Ethernet0/0
 ip address 192.168.12.1 255.255.255.0
 mpls ip
 mpls mtu 2000
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.13.1 255.255.255.0
 mpls ip
 mpls mtu 2000
 bandwidth 100000
 delay 10
 no shutdown
!
router ospf 1
 log-adjacency-changes
 network 0.0.0.0 255.255.255.255 area 0
!
no ip http server
no ip http secure-server
!
!
!
!
!
mpls ldp router-id Ethernet0/0 force
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
