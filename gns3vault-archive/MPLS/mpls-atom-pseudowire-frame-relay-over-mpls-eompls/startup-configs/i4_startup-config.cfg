!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname PE2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip source-route
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.0
!
interface Ethernet0/2
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
interface Ethernet0/0
 ip address 192.168.34.4 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
interface Serial4/0
 no ip address
 shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Serial5/0
 no ip address
 shutdown
!
interface Serial5/1
 no ip address
 shutdown
!
interface Serial5/2
 no ip address
 shutdown
!
interface Serial5/3
 no ip address
 shutdown
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
end
