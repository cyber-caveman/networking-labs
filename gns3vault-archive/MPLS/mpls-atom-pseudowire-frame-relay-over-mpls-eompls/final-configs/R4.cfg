!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname PE2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip source-route
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
frame-relay switching
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/2
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
interface Ethernet0/0
 ip address 192.168.34.4 255.255.255.0
 mpls ip
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
interface Serial4/0
 no ip address
 encapsulation frame-relay
 frame-relay intf-type dce
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
interface Serial5/0
 no ip address
 shutdown
!
interface Serial5/1
 no ip address
 shutdown
!
interface Serial5/2
 no ip address
 shutdown
!
interface Serial5/3
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 passive-interface Serial4/0
 network 0.0.0.0 255.255.255.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
connect PE1-PE2 Serial4/0 501 l2transport
 xconnect 2.2.2.2 15 encapsulation mpls
 !
!
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
end
