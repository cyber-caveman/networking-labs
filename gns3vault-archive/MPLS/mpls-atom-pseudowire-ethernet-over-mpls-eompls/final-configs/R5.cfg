!

!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname BananaBranch
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip source-route
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
!
interface Loopback0
 no ip address
!
interface Ethernet0/2
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
interface Ethernet0/0
 ip address 172.16.15.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 no ip address
 shutdown
 bandwidth 100000
 delay 10
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
end
