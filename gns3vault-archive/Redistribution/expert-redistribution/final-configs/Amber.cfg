!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Amber
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.35.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.45.5 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
!
ip prefix-list RIP-TO-E356-PREFIXES seq 10 permit 1.1.1.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 20 permit 2.2.2.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 30 permit 192.168.123.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 40 permit 3.3.3.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 50 permit 5.5.5.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 60 permit 6.6.6.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 70 permit 192.168.35.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 80 permit 4.4.4.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 90 permit 7.7.7.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 100 permit 192.168.45.0/24
ip prefix-list RIP-TO-E356-PREFIXES seq 110 permit 192.168.234.0/24
route-map RIP-TO-E356 permit 10
 match ip address prefix-list RIP-TO-E356-PREFIXES
 match tag 234
 set metric 100000 100 255 1 1500
 set tag 234
!
route-map RIP-TO-E356 permit 20
 match ip address prefix-list RIP-TO-E356-PREFIXES
 set metric 100000 100 255 1 1500
 set tag 100
!
ip prefix-list E356-TO-RIP-PREFIXES seq 10 permit 1.1.1.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 20 permit 2.2.2.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 30 permit 192.168.123.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 40 permit 3.3.3.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 50 permit 5.5.5.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 60 permit 6.6.6.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 70 permit 192.168.35.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 80 permit 4.4.4.0/24
ip prefix-list E356-TO-RIP-PREFIXES seq 90 permit 192.168.234.0/24
route-map E356-TO-RIP permit 10
 match ip address prefix-list E356-TO-RIP-PREFIXES
 match tag 234
 set metric 1
 set tag 234
!
route-map E356-TO-RIP permit 20
 match ip address prefix-list E356-TO-RIP-PREFIXES
 set metric 1
 set tag 100
!
access-list 10 permit 4.4.4.0 0.0.0.255
access-list 10 permit 7.7.7.0 0.0.0.255
access-list 10 permit 192.168.45.0 0.0.0.255
!
!
router eigrp 356
 redistribute rip route-map RIP-TO-E356
 network 5.0.0.0
 network 192.168.35.0
 no auto-summary
!
router rip
 redistribute eigrp 356 route-map E356-TO-RIP
 distance 175
 distance 120 0.0.0.0 255.255.255.255 10
 version 2
 network 192.168.45.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
