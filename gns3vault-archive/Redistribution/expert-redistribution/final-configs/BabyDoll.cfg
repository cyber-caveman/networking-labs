!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname BabyDoll
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.0
!
interface Ethernet0/0
 ip address 192.168.123.1 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
!
ip prefix-list BABYDOLL-LOOPBACK seq 10 permit 1.1.1.0/24
route-map LOOPBACK-TO-E123 permit 10
 match interface Loopback0
 match ip address prefix-list BABYDOLL-LOOPBACK
 set metric 100000 100 255 1 1500
 set tag 100
!
!
router eigrp 123
 redistribute connected route-map LOOPBACK-TO-E123
 network 192.168.123.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
