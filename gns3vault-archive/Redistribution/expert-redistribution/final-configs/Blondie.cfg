!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Blondie
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/0
 ip address 192.168.45.4 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.234.4 255.255.255.0
 encapsulation frame-relay
 ip ospf network broadcast
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
!
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 10 permit 1.1.1.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 20 permit 5.5.5.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 30 permit 6.6.6.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 40 permit 7.7.7.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 50 permit 192.168.123.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 60 permit 192.168.35.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 70 permit 192.168.45.0/24
route-map TO-OSPF deny 10
 match tag 234
!
route-map TO-OSPF permit 20
 match ip address prefix-list OSPF-EXTERNAL-PREFIXES
 set tag 100
!
ip prefix-list OSPF-TO-RIP-LOCAL seq 10 permit 4.4.4.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 10 permit 1.1.1.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 20 permit 2.2.2.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 30 permit 192.168.123.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 40 permit 3.3.3.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 50 permit 5.5.5.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 60 permit 6.6.6.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 70 permit 192.168.35.0/24
ip prefix-list OSPF-TO-RIP-BACKUP seq 80 permit 192.168.234.0/24
route-map OSPF-TO-RIP permit 10
 match ip address prefix-list OSPF-TO-RIP-LOCAL
 set metric 1
 set tag 100
!
route-map OSPF-TO-RIP permit 20
 match ip address prefix-list OSPF-TO-RIP-BACKUP
 set metric 10
 set tag 234
!
!
router ospf 234
 distance ospf intra-area 180 inter-area 180 external 180
 redistribute rip metric 20 metric-type 1 subnets route-map TO-OSPF
 log-adjacency-changes
 network 4.4.4.0 0.0.0.255 area 0
 network 192.168.234.0 0.0.0.255 area 0
!
router rip
 redistribute ospf 234 match internal external 1 external 2 route-map OSPF-TO-RIP
 version 2
 network 192.168.45.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
