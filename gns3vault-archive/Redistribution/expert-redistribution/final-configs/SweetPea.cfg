!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SweetPea
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/0
 ip address 192.168.123.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
interface Serial4/0
 ip address 192.168.234.2 255.255.255.0
 encapsulation frame-relay
 ip ospf network broadcast
 frame-relay lmi-type ansi
 no shutdown
!
interface Serial4/1
 no ip address
 shutdown
!
interface Serial4/2
 no ip address
 shutdown
!
interface Serial4/3
 no ip address
 shutdown
!
!
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 10 permit 1.1.1.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 20 permit 5.5.5.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 30 permit 6.6.6.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 40 permit 7.7.7.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 50 permit 192.168.123.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 60 permit 192.168.35.0/24
ip prefix-list OSPF-EXTERNAL-PREFIXES seq 70 permit 192.168.45.0/24
route-map TO-OSPF deny 10
 match tag 234
!
route-map TO-OSPF permit 20
 match ip address prefix-list OSPF-EXTERNAL-PREFIXES
 set tag 100
!
ip prefix-list FRAME-RELAY-SUBNET seq 10 permit 192.168.234.0/24
route-map E123-IN permit 5
 match ip address prefix-list FRAME-RELAY-SUBNET
!
route-map E123-IN deny 10
 match tag 234
!
route-map E123-IN permit 20
!
ip prefix-list OSPF-TO-E123-LOCAL seq 10 permit 2.2.2.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 10 permit 1.1.1.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 20 permit 192.168.123.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 30 permit 3.3.3.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 40 permit 5.5.5.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 50 permit 6.6.6.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 60 permit 192.168.35.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 70 permit 4.4.4.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 80 permit 7.7.7.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 90 permit 192.168.45.0/24
ip prefix-list OSPF-TO-E123-BACKUP seq 100 permit 192.168.234.0/24
route-map OSPF-TO-E123 permit 10
 match ip address prefix-list OSPF-TO-E123-LOCAL
 set metric 100000 100 255 1 1500
 set tag 100
!
route-map OSPF-TO-E123 permit 20
 match ip address prefix-list OSPF-TO-E123-BACKUP
 set metric 64 100000 255 1 1500
 set tag 234
!
!
router eigrp 123
 distribute-list route-map E123-IN in
 redistribute ospf 234 match internal external 1 external 2 route-map OSPF-TO-E123
 network 192.168.123.0
 no auto-summary
!
router ospf 234
 distance ospf intra-area 180 inter-area 180 external 180
 redistribute eigrp 123 metric 20 metric-type 1 subnets route-map TO-OSPF
 log-adjacency-changes
 network 2.2.2.0 0.0.0.255 area 0
 network 192.168.234.0 0.0.0.255 area 0
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
!
!
end
