!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Ditto
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
!
ip traffic-export profile IDS
  interface Ethernet0/2
  bidirectional
  incoming access-list EXPORT
  outgoing access-list EXPORT
  mac-address cc01.1059.0000
!
!
ip cef
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface Ethernet0/0
 ip address 192.168.12.2 255.255.255.0
 ip traffic-export apply IDS
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.23.2 255.255.255.0
 ip traffic-export apply IDS
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/2
 ip address 192.168.24.2 255.255.255.0
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 1
 passive-interface Ethernet0/2
 network 0.0.0.0
 no auto-summary
!
no ip http server
no ip http secure-server
!
!
!
!
ip access-list extended INSPECT
 permit eigrp any any
 permit tcp any any eq www
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 login
!
!
end
