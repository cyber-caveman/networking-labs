!
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Happy
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
!
!
!
interface Ethernet0/0
 ip address 192.168.34.4 255.255.255.0
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/1
 ip address 192.168.24.4 255.255.255.0
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
interface Ethernet0/2
 ip address 192.168.48.4 255.255.255.0
 full-duplex
 bandwidth 100000
 delay 10
 no shutdown
!
router eigrp 1
 network 0.0.0.0
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
